name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Portal demo (record, replay offline, reduce)
        run: python -m examples.portal_demo demo.db
      - name: CitaLab investigation (evidence checked byte for byte)
        run: python -m examples.citalab_r02 --no-reexecute --db r02.db
